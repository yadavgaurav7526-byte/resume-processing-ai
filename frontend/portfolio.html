
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Portfolio — PortfolioAI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body
    class="portfolio-page"
    id="portfolioBody"
>


    <!-- ==================================================
         NAVIGATION
    ================================================== -->

    <nav class="portfolio-nav">

    <div class="portfolio-logo">
        ✦ PortfolioAI
    </div>

    <button id="downloadPortfolioBtn" class="download-portfolio-btn">
        ↓ Download Portfolio
    </button>

    <div class="portfolio-nav-links">
        ...
    </div>

</nav>

    <!-- ==================================================
         MAIN PORTFOLIO
    ================================================== -->

    <main id="portfolioRoot">


        <!-- ==================================================
             HERO
        ================================================== -->

        <section
            class="portfolio-hero"
            id="about"
        >

            <div>

                <span class="portfolio-label">
                    HELLO, I'M
                </span>


                <h1 id="portfolioName">
                    Your Name
                </h1>


                <p
                    id="portfolioIntroduction"
                    class="portfolio-introduction"
                >
                    Your professional introduction.
                </p>


                <div class="portfolio-links">
    <a
        id="portfolioGithub"
        href="#"
        target="_blank"
        
    >
        GitHub
    </a>

    <a
        id="portfolioLinkedin"
        href="#"
        target="_blank"
    >
        LinkedIn
    </a>
</div>


                


        <!-- ==================================================
             EDUCATION
        ================================================== -->

        <section class="portfolio-section">

            <span class="portfolio-label">
                EDUCATION
            </span>

            <h2>
                Education
            </h2>


            <div
                id="portfolioEducation"
                class="portfolio-list"
            ></div>

        </section>



        <!-- ==================================================
             EXPERIENCE
        ================================================== -->

        <section
            class="portfolio-section"
            id="experience"
        >

            <span class="portfolio-label">
                EXPERIENCE
            </span>

            <h2>
                Experience
            </h2>


            <div
                id="portfolioExperience"
                class="portfolio-list"
            ></div>

        </section>



        <!-- ==================================================
             PROJECTS
        ================================================== -->

        <section
            class="portfolio-section"
            id="projects"
        >

            <span class="portfolio-label">
                SELECTED WORK
            </span>

            <h2>
                Projects
            </h2>


            <div
                id="portfolioProjects"
                class="portfolio-project-grid"
            ></div>

        </section>



        <!-- ==================================================
             SKILLS
        ================================================== -->

        <section
            class="portfolio-section"
            id="skills"
        >

            <span class="portfolio-label">
                EXPERTISE
            </span>

            <h2>
                Skills
            </h2>


            <div
                id="portfolioSkills"
                class="portfolio-skills"
            ></div>

        </section>



        <!-- ==================================================
             ACHIEVEMENTS
        ================================================== -->

        <section class="portfolio-section">

            <span class="portfolio-label">
                HIGHLIGHTS
            </span>

            <h2>
                Achievements
            </h2>


            <div
                id="portfolioAchievements"
                class="portfolio-list"
            ></div>

        </section>



        <!-- ==================================================
             CONTACT
        ================================================== -->

        <section
            class="portfolio-section portfolio-contact"
            id="contact"
        >

            <span class="portfolio-label">
                GET IN TOUCH
            </span>

            <h2>
                Let's connect.
            </h2>


            <p id="portfolioEmail">
                email@example.com
            </p>


            <p id="portfolioPhone"></p>

            <p id="portfolioLocation"></p>

        </section>


    </main>
    
    <script src="portfolio.js"></script>

</body>

</html>
